# Lab 2: OpenTelemetry + Tempo + Grafana.  Apply: kubectl apply -f 02-otel-tempo.yaml
# UIs: Grafana :30300 (admin/admin) | App :30080
apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
# ===== Tempo (single binary, local storage, 1h retention) =====
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: observability
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    compactor:
      compaction:
        block_retention: 1h
    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: { app: tempo }
  template:
    metadata:
      labels: { app: tempo }
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.6.0
          args: ["-config.file=/conf/tempo.yaml"]
          ports:
            - containerPort: 3200
            - containerPort: 4317
            - containerPort: 4318
          volumeMounts:
            - { name: conf, mountPath: /conf }
            - { name: data, mountPath: /var/tempo }
      volumes:
        - name: conf
          configMap: { name: tempo-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: observability
spec:
  selector: { app: tempo }
  ports:
    - { name: http,      port: 3200, targetPort: 3200 }
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
---
# ===== Grafana (datasources provisioned from this ConfigMap) =====
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo.observability:3200
        isDefault: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - { name: GF_SECURITY_ADMIN_USER,     value: admin }
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: admin }
          ports:
            - containerPort: 3000
          volumeMounts:
            - { name: ds, mountPath: /etc/grafana/provisioning/datasources }
      volumes:
        - name: ds
          configMap: { name: grafana-datasources }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
spec:
  type: NodePort
  selector: { app: grafana }
  ports:
    - { port: 3000, targetPort: 3000, nodePort: 30300 }
---
# ===== OpenTelemetry Collector =====
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      debug:
        verbosity: basic
      otlp/traces:
        endpoint: tempo.observability.svc.cluster.local:4317
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/traces, debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: { app: otel-collector }
  template:
    metadata:
      labels: { app: otel-collector }
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.108.0
          args: ["--config=/conf/config.yaml"]
          ports:
            - containerPort: 4317
            - containerPort: 4318
            - containerPort: 8889
          volumeMounts:
            - { name: conf, mountPath: /conf }
      volumes:
        - name: conf
          configMap: { name: otel-collector-config }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc,   port: 4317, targetPort: 4317 }
    - { name: otlp-http,   port: 4318, targetPort: 4318 }
    - { name: prom-export, port: 8889, targetPort: 8889 }
---
# ===== Demo app: frontend -> backend (+ load generator) =====
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-code
  namespace: demo
data:
  backend.py: |
    import logging, random, time
    from flask import Flask
    from opentelemetry import trace

    logging.getLogger().setLevel(logging.INFO)
    log = logging.getLogger("backend")
    app = Flask(__name__)
    tracer = trace.get_tracer("backend.manual")

    @app.route("/work")
    def work():
        with tracer.start_as_current_span("calculate-price") as span:
            delay = random.uniform(0.05, 0.6)
            span.set_attribute("simulated.delay_seconds", round(delay, 3))
            time.sleep(delay)
        if random.random() < 0.15:   # ~15% failures
            log.error("random backend failure")
            raise RuntimeError("random backend failure")
        log.info("work done in %.3fs", delay)
        return {"status": "ok", "delay": delay}

    app.run(host="0.0.0.0", port=8081)
  frontend.py: |
    import logging, requests
    from flask import Flask

    logging.getLogger().setLevel(logging.INFO)
    log = logging.getLogger("frontend")
    app = Flask(__name__)

    @app.route("/")
    def index():
        r = requests.get("http://backend.demo:8081/work", timeout=5)
        log.info("backend returned %s", r.status_code)
        return {"frontend": "ok", "backend_status": r.status_code}

    app.run(host="0.0.0.0", port=8080)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - >
              pip install --no-cache-dir flask requests opentelemetry-distro opentelemetry-exporter-otlp &&
              opentelemetry-bootstrap -a install &&
              opentelemetry-instrument python /app/backend.py
          env:
            - { name: OTEL_SERVICE_NAME,           value: backend }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability:4317" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: grpc }
            - { name: OTEL_TRACES_EXPORTER,        value: otlp }
            - { name: OTEL_METRICS_EXPORTER,       value: none }
            - { name: OTEL_LOGS_EXPORTER,          value: none }
          ports:
            - containerPort: 8081
          volumeMounts:
            - { name: code, mountPath: /app }
      volumes:
        - name: code
          configMap: { name: app-code }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: demo
spec:
  selector: { app: backend }
  ports:
    - { port: 8081, targetPort: 8081 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - >
              pip install --no-cache-dir flask requests opentelemetry-distro opentelemetry-exporter-otlp &&
              opentelemetry-bootstrap -a install &&
              opentelemetry-instrument python /app/frontend.py
          env:
            - { name: OTEL_SERVICE_NAME,           value: frontend }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability:4317" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: grpc }
            - { name: OTEL_TRACES_EXPORTER,        value: otlp }
            - { name: OTEL_METRICS_EXPORTER,       value: none }
            - { name: OTEL_LOGS_EXPORTER,          value: none }
          ports:
            - containerPort: 8080
          volumeMounts:
            - { name: code, mountPath: /app }
      volumes:
        - name: code
          configMap: { name: app-code }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: demo
spec:
  type: NodePort
  selector: { app: frontend }
  ports:
    - { port: 8080, targetPort: 8080, nodePort: 30080 }
---
# Sends 1 request/second to the frontend so traces keep flowing.
# Scale to 0 to stop:  kubectl scale deploy/loadgen -n demo --replicas=0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: loadgen }
  template:
    metadata:
      labels: { app: loadgen }
    spec:
      containers:
        - name: loadgen
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - 'sleep 90; while true; do curl -s -o /dev/null http://frontend.demo:8080/; sleep 1; done'
